[package]
name    = "bcdedit"
version = "0.2.0-alpha.2"
edition = "2021"

[dependencies]
bcdedit-macros.path = "./macros"
hivex.path          = "../hivex"

allocator-api2 = "0.3"
binrw          = "0.15"
bitflags       = "2"
bytemuck       = "1.23"
num_enum       = "0.7"
uuid           = { version = "1", features = ["v4", "fast-rng"] }
smallstr       = "0.3"

[dependencies.derive_more]
version  = "1"
features = ["debug", "display", "error"]

[dev-dependencies]
assert2 = "0.3"
