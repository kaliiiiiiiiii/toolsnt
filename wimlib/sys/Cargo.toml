[package]
name    = "wimlib-sys"
version = "0.3.1"
edition = "2021"
links   = "wimlib"

description = "Raw and generated bindings to wimlib"
repository  = "https://codeberg.org/erin/toolsnt"
categories  = ["external-ffi-bindings"]
license     = "EUPL-1.2"

[features]
bundled     = []
sys-ntfs-3g = []

[build-dependencies]
autotools  = { workspace = true }
bindgen    = { workspace = true }
const-str  = { workspace = true }
flate2     = { workspace = true }
pkg-config = { workspace = true }
sha2       = { workspace = true }
tar        = { workspace = true }
